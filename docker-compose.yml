version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: ecommerce_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: system
      POSTGRES_DB: ecommerce_marketplace
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/src/database/schema.sql:/docker-entrypoint-initdb.d/schema.sql

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ecommerce_backend
    restart: always
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:system@postgres:5432/ecommerce_marketplace
      RAZORPAY_KEY_ID: rzp_test_TlHmBY5CY5RsrT
      RAZORPAY_KEY_SECRET: uhonCePTSwHWV7nvWpwHlhrU
    ports:
      - "5000:5000"
    depends_on:
      - postgres

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ecommerce_frontend
    restart: always
    environment:
      PORT: 80
      BACKEND_URL: http://backend:5000
    ports:
      - "4200:80"
    depends_on:
      - backend

volumes:
  pgdata:
