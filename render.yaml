services:
  # ----------------------------------------------------
  # Unified Marketplace Web Service (Frontend + Backend)
  # Built from root Dockerfile with multi-stage caching
  # ----------------------------------------------------
  - type: web
    name: apexkart-marketplace
    env: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: starter
    region: oregon
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: DATABASE_URL
        fromDatabase:
          name: ecommerce-postgres
          property: connectionString
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: CORS_ORIGIN
        value: '*'

databases:
  # ----------------------------------------------------
  # Managed PostgreSQL Database
  # ----------------------------------------------------
  - name: ecommerce-postgres
    databaseName: ecommerce_marketplace
    user: postgres
    plan: starter
    region: oregon
