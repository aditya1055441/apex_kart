services:
  # ----------------------------------------------------
  # Backend REST API Service
  # ----------------------------------------------------
  - type: web
    name: ecommerce-backend
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: starter
    region: oregon
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: DATABASE_URL
        fromDatabase:
          name: ecommerce-postgres
          property: connectionString
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: CORS_ORIGIN
        value: '*'

  # ----------------------------------------------------
  # Frontend Angular Web Service (Nginx Container)
  # ----------------------------------------------------
  - type: web
    name: ecommerce-frontend
    env: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    plan: starter
    region: oregon
    envVars:
      - key: PORT
        value: 80
      - key: BACKEND_URL
        fromService:
          type: web
          name: ecommerce-backend
          property: host

databases:
  # ----------------------------------------------------
  # Managed PostgreSQL Database
  # ----------------------------------------------------
  - name: ecommerce-postgres
    databaseName: ecommerce_marketplace
    user: postgres
    plan: starter
    region: oregon
